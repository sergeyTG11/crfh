<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crash Game Pro</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #2b103e 0%, #150624 100%);
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
            -webkit-user-select: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 5px;
        }
        .ref-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .balances { display: flex; gap: 8px; }
        .stat-box {
            background: #422057;
            border: 1px solid #5d2b7a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-box span { color: #ffb600; }
        h2 { font-size: 22px; font-weight: 800; text-transform: uppercase; margin: 10px 0 25px 0; letter-spacing: 1px; }
                .menu-row {
            background: linear-gradient(135deg, #1f1235 0%, #130922 100%);
            border: 1px solid #331d52;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 12px;
            text-align: left;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
            font-size: 17px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu-row:active { transform: scale(0.98); }
        .menu-row.free-btn { border-color: #05c46b; background: linear-gradient(135deg, #093320 0%, #03160d 100%); }
        .menu-row.inv-btn { border-color: #5d2b7a; background: linear-gradient(135deg, #2e1544 0%, #160724 100%); }
        
        .arrow-icon { color: #a496b8; font-size: 14px; }
        .price-tag { font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.05); }
        .price-tag.p50 { color: #ff5e57; border: 1px solid rgba(255,94,87,0.3); }
        .price-tag.p125 { color: #ffb600; border: 1px solid rgba(255,182,0,0.3); }

        .screen { display: none; }
        .screen.active { display: block; }
        .back-btn { background: #331d52; border: 1px solid #5d2b7a; color: white; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; }

        .roulette-box { background: #160a26; border: 1px solid #ff52b2; border-radius: 20px; padding: 30px 15px; margin-top: 20px; box-shadow: 0 0 25px rgba(255,82,178,0.2); }
        .spinner-container { width: 150px; height: 150px; margin: 20px auto; background: #080311; border-radius: 16px; border: 3px dashed #ff52b2; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: inset 0 0 15px rgba(0,0,0,0.8); }
        .spinner-img { width: 85%; height: 85%; object-fit: contain; }
        .reward-title { font-size: 20px; font-weight: 900; color: #ffd32a; min-height: 28px; margin-top: 10px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .nft-item { background: #1c0d2b; border: 1px solid #3d1d5c; border-radius: 14px; padding: 15px 10px; text-align: center; }
        .nft-item img { width: 70px; height: 70px; object-fit: contain; margin-bottom: 8px; }
        .nft-name { font-size: 13px; font-weight: bold; color: #fff; }
        .empty-text { color: #a496b8; grid-column: span 2; padding: 40px 0; font-size: 14px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="ref-btn" onclick="alert('Ссылка скопирована!')">🔗 Ссылка</button>
        <div class="balances">
            <div class="stat-box">💰 <span id="balanceText">250</span></div>
            <div class="stat-box">⭐ <span>0</span></div>
        </div>
    </div>

    <h2>💥 CRASH GAME 💥</h2>

    <!-- ГЛАВНЫЙ ЭКРАН (3 СТРОЧКИ) -->
    <div id="screenMain" class="screen active">
        <div class="menu-row free-btn" onclick="openCase('free')">
            <span>🎁 Бесплатный кейс</span>
            <span class="arrow-icon">Крутить ➔</span>
        </div>
        <div class="menu-row inv-btn" onclick="switchScreen('inventory')">
            <span>🎒 Инвентарь</span>
            <span class="arrow-icon">Открыть рюкзак ➔</span>
        </div>
        <div class="menu-row" onclick="switchScreen('cases_list')">
            <span>📦 Кейсы</span>
            <span class="arrow-icon">Посмотреть ➔</span>
        </div>
    </div>
        <!-- ВНУТРЕННИЙ СПИСОК КЕЙСОВ -->
    <div id="screenCasesList" class="screen">
        <h3 style="text-align: left; margin-left: 5px; color: #a496b8; font-size: 15px; text-transform: uppercase;">Платные кейсы:</h3>
        <div class="menu-row" onclick="openCase('crash_50')">
            <span>💥 Crash Case 50</span>
            <span class="price-tag p50">50 💰</span>
        </div>
        <div class="menu-row" onclick="openCase('crash_125')">
            <span>🐸 Crash Case 125</span>
            <span class="price-tag p125">125 💰</span>
        </div>
        <button class="back-btn" onclick="switchScreen('main')">⬅️ Назад в меню</button>
    </div>

    <!-- ЭКРАН 3D-РУЛЕТКИ -->
    <div id="screenRoulette" class="screen">
        <div class="roulette-box">
            <h3 id="rouletteTitle" style="margin: 0; text-transform: uppercase;">Открытие...</h3>
            <div class="spinner-container">
                <img src="https://tgapi.ru" id="spinnerImg" class="spinner-img" alt="NFT">
            </div>
            <div class="reward-title" id="rewardTitle">Прокрутка...</div>
            <p id="statusText" style="font-size: 13px; color: #a496b8; margin: 10px 0 0 0;">Алгоритм выбирает NFT-Подарок...</p>
        </div>
    </div>

    <!-- ЭКРАН РЮКЗАКА -->
    <div id="screenInventory" class="screen">
        <h3 style="text-align: left; margin-left: 5px; color: #b666ff; font-size: 15px; text-transform: uppercase;">Ваш рюкзак:</h3>
        <div class="inventory-grid" id="inventoryGrid"></div>
        <button class="back-btn" onclick="switchScreen('main')">⬅️ Назад в меню</button>
    </div>
        <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        // Безопасное сохранение баланса в локальную память Mini App
        let balance = parseInt(localStorage.getItem('crash_user_bal')) || 250;
        let inventory = JSON.parse(localStorage.getItem('crash_user_inv')) || [];

        document.getElementById('balanceText').innerText = balance;

        const ALL_NFT_ITEMS = [
            { name: "NFT Синий Подарок", img: "https://tgapi.ru" },
            { name: "NFT Золотой Подарок", img: "https://tgapi.ru" },
            { name: "NFT Плюшевый Пепе", img: "https://tgapi.ru" },
            { name: "NFT Рубиновое Сердце", img: "https://tgapi.ru" },
            { name: "NFT Кристалл Души", img: "https://tgapi.ru" }
        ];

        function switchScreen(name) {
            document.getElementById('screenMain').classList.remove('active');
            document.getElementById('screenCasesList').classList.remove('active');
            document.getElementById('screenRoulette').classList.remove('active');
            document.getElementById('screenInventory').classList.remove('active');
            if (name === 'main') document.getElementById('screenMain').classList.add('active');
            else if (name === 'cases_list') document.getElementById('screenCasesList').classList.add('active');
            else if (name === 'inventory') { document.getElementById('screenInventory').classList.add('active'); renderInventory(); }
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid'); grid.innerHTML = '';
            if (inventory.length === 0) { grid.innerHTML = '<div class="empty-text">🎒 Твой рюкзак пока пуст.</div>'; return; }
            inventory.forEach(itemStr => {
                const itemObj = ALL_NFT_ITEMS.find(x => x.name === itemStr) || ALL_NFT_ITEMS[0];
                const card = document.createElement('div'); card.className = 'nft-item';
                card.innerHTML = `<img src="${itemObj.img}"><div class="nft-name">${itemObj.name}</div>`;
                grid.appendChild(card);
            });
        }
                    function openCase(caseType) {
            const prices = { free: 0, crash_50: 50, crash_125: 125 };
            const cost = prices[caseType];
            if (balance < cost) { tg.HapticFeedback.notificationOccurred('error'); alert("❌ Недостаточно монет!"); return; }

            tg.HapticFeedback.impactOccurred('medium');
            balance -= cost; localStorage.setItem('crash_user_bal', balance);
            document.getElementById('balanceText').innerText = balance;

            document.getElementById('screenMain').classList.remove('active');
            document.getElementById('screenCasesList').classList.remove('active');
            document.getElementById('screenRoulette').classList.add('active');
            document.getElementById('rouletteTitle').innerText = "ОТКРЫТИЕ...";

            const spinnerImg = document.getElementById('spinnerImg');
            let ticks = 0;

            function spinCycle() {
                const randomVisual = ALL_NFT_ITEMS[Math.floor(Math.random() * ALL_NFT_ITEMS.length)];
                spinnerImg.src = randomVisual.img;
                tg.HapticFeedback.impactOccurred('light');
                ticks++;

                if (ticks < 14) { setTimeout(spinCycle, 150); } 
                else {
                    const finalItem = ALL_NFT_ITEMS[Math.floor(Math.random() * ALL_NFT_ITEMS.length)];
                    spinnerImg.src = finalItem.img;
                    document.getElementById('rewardTitle').innerText = `🎉 ${finalItem.name}`;
                    tg.HapticFeedback.notificationOccurred('success');
                    
                    inventory.push(finalItem.name);
                    localStorage.setItem('crash_user_inv', JSON.stringify(inventory));

                    setTimeout(() => { tg.sendData(JSON.stringify({ reward: finalItem.name })); }, 1500);
                }
            }
            spinCycle();
        }
    </script>
</body>
</html>
